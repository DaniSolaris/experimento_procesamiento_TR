services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: iot_broker
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  producer:
    build: ./producer
    container_name: iot_producer
    depends_on:
      - redpanda
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:29092"
      TOPIC_NAME: "iot_sensor_data"

  consumer:
    build: ./consumer
    container_name: iot_consumer
    depends_on:
      - redpanda
      - producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:29092"
      TOPIC_NAME: "iot_sensor_data"
      GROUP_ID: "iot_anomaly_detector_group"

  